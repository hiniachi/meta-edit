name: build-dist

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "tsconfig*.json"
      - "bun.lock"

concurrency:
  group: build-dist-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-dist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Cache bun install
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - run: bun run build

      - name: Fail if dist/ drifted from source
        run: |
          if [[ -n "$(git status --porcelain dist/)" ]]; then
            echo "::error::dist/ is stale relative to src/. Run 'bun run build' locally and commit the result." >&2
            git --no-pager diff -- dist/ | head -200
            exit 1
          fi
          echo "dist/ matches a fresh build of src/"
