name: Publish to npm

# Publishes @hiniachi/meta-edit to the npm registry when a GitHub Release
# is published. Authentication uses npm Trusted Publisher (OIDC) — no
# NPM_TOKEN secret is required as long as this repo/workflow is registered
# as a trusted publisher for the package on npmjs.com. Provenance is
# attached so consumers can verify the build originated from this workflow.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run npm publish with --dry-run (no upload)"
        type: boolean
        default: true

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # GitHub Environment name must match the npm Trusted Publisher
    # configuration on https://www.npmjs.com/package/@hiniachi/meta-edit/access
    # (Publishing access → Trusted Publishers → Environment name = "nia").
    # OIDC claims are checked against all four keys (owner, repository,
    # workflow filename, environment); a missing or wrong environment
    # field causes npm to reject the publish with 404 Not Found.
    environment: nia
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          # No `registry-url`. Setting it makes setup-node write an
          # .npmrc with `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`
          # and export `NODE_AUTH_TOKEN=XXXXX-XXXXX-XXXXX-XXXXX` as a
          # placeholder. npm then treats the placeholder as a valid
          # bearer token, never falls through to OIDC token exchange,
          # and the npm registry returns `404 Not Found` (its opaque
          # response for "this token has no write access to this
          # package"). Trusted Publisher OIDC reads the registry from
          # the package.json scope and authenticates via OIDC token
          # exchange directly — no .npmrc shim required.

      # Trusted Publisher OIDC token exchange landed in npm CLI 11.5.1.
      # Node 22 still ships npm 10.x, which silently skips the OIDC
      # path and fails the publish with `ENEEDAUTH / need auth` even
      # when every OIDC claim (owner, repository, workflow, environment)
      # matches the npm Trusted Publisher configuration. Upgrade to the
      # current npm so `npm publish --provenance` actually requests the
      # OIDC ID token, exchanges it for a registry bearer, and PUTs the
      # tarball.
      - name: Upgrade npm (Trusted Publisher OIDC needs >= 11.5.1)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      # Diagnostic step: dump the OIDC token's claims so we can compare
      # them byte-for-byte against the npm Trusted Publisher config.
      # When a publish 404s despite the four configured keys (owner,
      # repository, workflow_filename, environment) appearing correct,
      # the mismatch is usually invisible at the UI layer (case-sensitive
      # whitespace, an unexpected repo-rename, the wrong environment
      # name on the workflow side, etc.). The claim dump puts the
      # actual values that npm sees on screen.
      #
      # Only runs on workflow_dispatch to keep release-event logs clean
      # and to avoid leaking diagnostic noise into the audit trail of a
      # real publish. The token itself is requested with the npm
      # audience so the claims reflect exactly what the npm registry
      # validates against.
      - name: Debug — dump OIDC claims (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('npm:registry.npmjs.org');
            const parts = token.split('.');
            const payload = JSON.parse(
              Buffer.from(parts[1], 'base64url').toString('utf8'),
            );
            // Strip volatile / sensitive fields before printing.
            delete payload.iat;
            delete payload.exp;
            delete payload.nbf;
            delete payload.jti;
            core.startGroup('OIDC claims (sanitized, npm audience)');
            console.log(JSON.stringify(payload, null, 2));
            core.endGroup();

      # Release tag (e.g. "v0.4.3") must match package.json.version. The
      # CI workflow already enforces package.json/plugin.json sync, so
      # checking against package.json is sufficient.
      - name: Verify release tag matches package.json version
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(jq -r .version package.json)
          if [ "$tag" != "$pkg" ]; then
            echo "::error::release tag ($tag) != package.json version ($pkg)" >&2
            echo "Bump package.json + .claude-plugin/plugin.json before creating the release." >&2
            exit 1
          fi
          echo "version OK: $pkg"

      - name: Publish to npm (dry-run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry-run
        run: npm publish --access public --provenance --dry-run

      - name: Publish to npm
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && !inputs.dry-run)
        run: npm publish --access public --provenance
