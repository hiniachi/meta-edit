name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [bun, node]
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node 20
        if: matrix.runtime == 'node'
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test (Bun)
        if: matrix.runtime == 'bun'
        run: bun test

      - name: Test (Node)
        if: matrix.runtime == 'node'
        run: bun test

  version-sync:
    name: version-sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Assert package.json/plugin.json version + tool-count description sync
        run: |
          pkg=$(jq -r .version package.json)
          plg=$(jq -r .version .claude-plugin/plugin.json)
          if [ -z "$pkg" ] || [ "$pkg" = "null" ]; then
            echo "::error::package.json has no .version field" >&2
            exit 1
          fi
          if [ -z "$plg" ] || [ "$plg" = "null" ]; then
            echo "::error::.claude-plugin/plugin.json has no .version field" >&2
            exit 1
          fi
          if [ "$pkg" != "$plg" ]; then
            echo "::error::package.json.version ($pkg) != .claude-plugin/plugin.json.version ($plg)" >&2
            echo "Bump both files in the same commit; Claude Code reads plugin.json for marketplace discovery." >&2
            exit 1
          fi
          echo "version sync OK: $pkg"

          # PR #42 self-review: marketplace.json descriptions were missed
          # by the manual "eighteen" → "nineteen" sweep. Pin tool-count
          # mentions in the public manifests so a future tool addition
          # cannot land without updating every consumer-visible string.
          for f in package.json .claude-plugin/plugin.json .claude-plugin/marketplace.json; do
            if grep -F "eighteen" "$f" >/dev/null 2>&1; then
              echo "::error::$f mentions 'eighteen' — refresh tool-count description after adding/removing edit_* tools" >&2
              exit 1
            fi
          done
          # marketplace.json is required for /plugin install discovery —
          # confirm its plugin entry name matches plugin.json.name.
          if [ -f .claude-plugin/marketplace.json ]; then
            mp_name=$(jq -r '.plugins[0].name' .claude-plugin/marketplace.json)
            plg_name=$(jq -r .name .claude-plugin/plugin.json)
            if [ "$mp_name" != "$plg_name" ]; then
              echo "::error::marketplace.json plugins[0].name ($mp_name) != plugin.json.name ($plg_name)" >&2
              exit 1
            fi
          fi
          echo "manifest description sync OK"
